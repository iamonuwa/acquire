# Poll table. Two sources: nlpdp-sa-criteria and hc-dpd-allfiles.
# Alberta iDBL and RAMQ are unresolved stubs — not poll targets, no URL.
# strip_rules stays empty until the soak; each entry names the false positive it fixes and the date.
sources:
  - id: nlpdp-sa-criteria
    jurisdiction: NL
    publisher: NL Health and Community Services
    fetch: scrape_anchor
    normalize: pdf
    poll_interval: 24h
    staleness_alarm_days: 60
    enabled: true
    scrape:
      link_scope: 'a[href$=".pdf"]'
      anchor_pattern: 'Criteria-[A-Za-z]+-\d{4}\.pdf$'
    strip_rules: []

  - id: hc-dpd-allfiles
    jurisdiction: CA
    publisher: Health Canada
    fetch: scrape_anchor
    normalize: zip_members
    poll_interval: 168h
    staleness_alarm_days: 60
    enabled: true
    scrape:
      link_scope: 'a[href$=".zip"]'
      anchor_pattern: 'allfiles\.zip$'
    strip_rules: []

  - id: ab-idbl
    state: unresolved
  - id: qc-ramq
    state: unresolved
